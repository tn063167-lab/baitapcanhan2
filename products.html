<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coolmate | Danh sách sản phẩm</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">coolmate<span>.</span></a>
    <nav class="main-nav">
      <a href="index.html">Trang chủ</a>
      <a href="products.html">Sản phẩm</a>
      <a href="product-detail.html">Chi tiết</a>
      <a href="about.html">Giới thiệu</a>
    </nav>
  </header>

  <main>
    <section class="product-section">
      <div class="section-heading">
        <h2>Tất cả sản phẩm</h2>
      </div>
      <div class="product-grid">
        <article class="product-card">
          <div class="product-image">
            <span class="tag">BÁN CHẠY</span>
            <img src="images/product-1.jpg" alt="Áo thun nam Cotton Compact">
          </div>
          <div class="product-info">
            <h3>Áo thun nam Cotton Compact</h3>
            <div class="price-row"><span class="current-price">239.000đ</span></div>
            <button class="add-button" type="button">Chọn sản phẩm</button>
          </div>
        </article>
        <article class="product-card">
          <div class="product-image">
            <span class="tag">HOT</span>
            <img src="images/product-2.jpg" alt="Áo Polo nam Excool">
          </div>
          <div class="product-info">
            <h3>Áo Polo nam Excool</h3>
            <div class="price-row"><span class="current-price">349.000đ</span></div>
            <button class="add-button" type="button">Chọn sản phẩm</button>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Coolmate Demo - Bài tập cá nhân Buổi 2</p>
  </footer>
</body>
</html>
